<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=JSON.parse(localStorage.getItem("ct_theme"));if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="escuro";document.documentElement.dataset.theme=t||"claro"}catch(e){}</script>
<title>Login · ConectaTec</title>
<link rel="icon" href="assets/img/icone-escuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="01">
<div class="auth">
  <aside class="auth-brand">
    <div class="brand-row" aria-label="ConectaTec"><img class="logo-mark" src="assets/img/icone-escuro.png" alt=""><span class="brand-name">Conecta<span>Tec</span></span></div>
    <div>
      <h2 class="auth-headline">Encontre quem <span class="accent">resolve.</span></h2>
      <p class="auth-text">Conecte-se a técnicos especializados e acompanhe todo o atendimento em um só lugar!</p>
    </div>
  </aside>
  <main class="auth-main">
  <div class="card card-form">

    <h1 class="title-lg">Entrar na sua conta</h1>
    <p class="subtitle">Acompanhe seus atendimentos em um só lugar</p>

    <div class="field">
      <label class="field-label">E-mail</label>
      <div class="field-input">
        <span class="field-icon"><span class="material-symbols-outlined">mail</span></span>
        <input type="email" id="email" placeholder="nome@email.com" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label class="field-label">Senha</label>
      <div class="field-input">
        <span class="field-icon"><span class="material-symbols-outlined">lock</span></span>
        <input type="password" id="senha" placeholder="Digite sua senha">
      </div>
    </div>

    <div class="link-end"><a class="link" href="03-recuperacao-senha.html">Esqueci minha senha</a></div>

    <a data-action="login" class="btn btn-primary" href="04-dashboard-cliente.html">Entrar</a>

    <div class="divider-row">
      <div class="divider-line"></div>
      <span class="divider-text">ou</span>
      <div class="divider-line"></div>
    </div>

    <p class="link-center">Não tem uma conta? <a class="link" href="02-cadastro.html">Cadastre-se</a></p>
  </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
