<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=JSON.parse(localStorage.getItem("ct_theme"));if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="escuro";document.documentElement.dataset.theme=t||"claro"}catch(e){}</script>
<title>Nova solicitação · ConectaTec</title>
<link rel="icon" href="assets/img/icone-escuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="05">
<div class="page">
  <div class="card card-form" style="width:460px;">
    <div class="back-row"><a class="icon-btn" href="04-dashboard-cliente.html" aria-label="Voltar"><span class="material-symbols-outlined">arrow_back</span></a><h1 class="title-md">Nova solicitação</h1></div>

    <div class="field">
      <label class="field-label" for="aparelho">Tipo de aparelho *</label>
      <div class="field-input"><span class="field-icon"><span class="material-symbols-outlined">laptop_mac</span></span><input type="text" id="aparelho" required aria-required="true" placeholder="Ex: notebook, celular, impressora"></div>
    </div>

    <div class="field">
      <label class="field-label" for="descricao">Descreva o problema *</label>
      <div class="field-input textarea"><textarea id="descricao" required aria-required="true" minlength="10" placeholder="Conte o que está acontecendo com o aparelho"></textarea></div>
    </div>

    <p class="field-label">Tipo de atendimento</p>
    <div class="choice-grid">
      <div class="choice-card selected"><div><span class="material-symbols-outlined">home</span></div><p class="choice-title">Presencial</p></div>
      <div class="choice-card"><div><span class="material-symbols-outlined">videocam</span></div><p class="choice-title">Remoto</p></div>
    </div>

    <p class="field-label">Prioridade</p>
    <div class="priority-grid">
      <div class="priority-option priority-low">Baixa</div>
      <div class="priority-option selected priority-medium">Média</div>
      <div class="priority-option priority-high">Crítica</div>
    </div>

    <div class="field">
      <label class="field-label" for="prazo">Prazo desejado *</label>
      <div class="field-input"><span class="field-icon"><span class="material-symbols-outlined">calendar_month</span></span><input type="text" id="prazo" required aria-required="true" placeholder="Ex: em até 3 dias"></div>
    </div>

    <div class="field">
      <label class="field-label">Fotos do aparelho <span class="field-hint">(opcional, até 5 · <span id="photo-count">0/5</span>)</span></label>
      <div class="photo-actions">
        <button type="button" class="btn btn-outline" id="photo-gallery"><span class="material-symbols-outlined">photo_library</span> Galeria ou computador</button>
        <button type="button" class="btn btn-outline" id="photo-camera"><span class="material-symbols-outlined">photo_camera</span> Tirar foto</button>
      </div>
      <input type="file" id="photo-file" accept="image/*" multiple hidden>
      <input type="file" id="photo-capture" accept="image/*" capture="environment" hidden>
      <div id="photo-preview" class="photo-grid"></div>
    </div>

    <p class="field-hint" style="margin:0 0 12px;">* Campos obrigatórios</p>
    <a data-action="newreq" class="btn btn-primary" href="06-minhas-solicitacoes.html">Enviar solicitação</a>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
