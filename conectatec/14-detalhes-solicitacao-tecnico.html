<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=JSON.parse(localStorage.getItem("ct_theme"));if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="escuro";document.documentElement.dataset.theme=t||"claro"}catch(e){}</script>
<title>Detalhes da solicitação · ConectaTec</title>
<link rel="icon" href="assets/img/icone-escuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="14">
<div class="page">
  <div class="card card-form" style="width:460px;">
    <div class="back-row">
      <a class="icon-btn" href="13-solicitacoes-disponiveis.html" aria-label="Voltar"><span class="material-symbols-outlined">arrow_back</span></a>
      <h1 class="title-md" style="flex:1;" id="d-title">Solicitação</h1>
      <span class="badge" id="d-badge"></span>
    </div>

    <div class="list-row" style="background:var(--cinza-gelo);margin-bottom:16px;">
      <div class="avatar avatar-sm" style="background:var(--roxo-claro-bg);" id="d-cini">?</div>
      <div class="list-row-main"><p class="list-row-title" id="d-cliente">Cliente</p><p class="list-row-sub">Cliente</p></div>
      <a href="11-chat.html" aria-label="Abrir conversa" style="width:36px;height:36px;border-radius:8px;background:var(--branco);display:flex;align-items:center;justify-content:center;color:inherit;text-decoration:none;"><span class="material-symbols-outlined">chat</span></a>
    </div>

    <div class="detail-box">
      <div class="detail-row"><span class="detail-label">Aparelho</span><span class="detail-value" data-f="Aparelho">—</span></div>
      <div class="detail-row"><span class="detail-label">Tipo de atendimento</span><span class="detail-value" data-f="Tipo de atendimento">—</span></div>
      <div class="detail-row"><span class="detail-label">Prioridade</span><span class="detail-value" data-f="Prioridade">—</span></div>
      <div class="detail-row" style="margin-bottom:0;"><span class="detail-label">Prazo desejado</span><span class="detail-value" data-f="Prazo desejado">—</span></div>
    </div>

    <p class="field-label">Descrição do problema</p>
    <p class="subtitle" id="d-desc" style="white-space:pre-wrap;">—</p>
    <div id="d-photos"></div>

    <div id="d-form">
      <div class="field">
        <label class="field-label" for="diag">Diagnóstico *</label>
        <div class="field-input textarea"><textarea id="diag" placeholder="Descreva o diagnóstico do equipamento"></textarea></div>
      </div>
      <div class="field">
        <label class="field-label" for="q-valor">Valor do serviço (R$) *</label>
        <div class="field-input"><span class="field-icon"><span class="material-symbols-outlined">payments</span></span><input type="text" inputmode="numeric" id="q-valor" placeholder="R$ 0,00" autocomplete="off"></div>
      </div>
      <div class="field">
        <label class="field-label" for="q-dias">Prazo estimado (dias úteis) *</label>
        <div class="field-input"><span class="field-icon"><span class="material-symbols-outlined">calendar_month</span></span><input type="number" id="q-dias" min="1" max="365" step="1" inputmode="numeric" placeholder="Ex: 3"></div>
      </div>
    </div>

    <div class="btn-row" id="d-actions">
      <a class="btn btn-outline" href="13-solicitacoes-disponiveis.html">Recusar</a>
      <a data-action="techquote" class="btn btn-primary" style="flex:2;" href="#">Aceitar e enviar orçamento</a>
    </div>
    <a data-action="remove" class="btn btn-outline" style="margin-top:10px;color:var(--vermelho-tx);" href="#"><span class="material-symbols-outlined">delete</span> Excluir solicitação</a>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
