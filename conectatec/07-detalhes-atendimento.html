<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=JSON.parse(localStorage.getItem("ct_theme"));if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="escuro";document.documentElement.dataset.theme=t||"claro"}catch(e){}</script>
<title>Detalhes do atendimento · ConectaTec</title>
<link rel="icon" href="assets/img/icone-escuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="07">
<div class="page">
  <div class="card card-form" style="width:460px;">
    <div class="back-row"><a class="icon-btn" href="06-minhas-solicitacoes.html" aria-label="Voltar"><span class="material-symbols-outlined">arrow_back</span></a><h1 class="title-md" id="d-title">Atendimento</h1></div>

    <div class="stepper">
      <div class="step"><div class="step-dot done"><span class="material-symbols-outlined">check</span></div><span class="step-label">Recebido</span></div>
      <div class="step-line done"></div>
      <div class="step"><div class="step-dot done"><span class="material-symbols-outlined">check</span></div><span class="step-label">Em análise</span></div>
      <div class="step-line current"></div>
      <div class="step"><div class="step-dot current"></div><span class="step-label">Em reparo</span></div>
      <div class="step-line"></div>
      <div class="step"><div class="step-dot todo"></div><span class="step-label todo">Pronto</span></div>
    </div>

    <div class="list-row" style="background:var(--cinza-gelo);margin-bottom:14px;">
      <div class="avatar avatar-sm" id="d-tini">?</div>
      <div class="list-row-main"><p class="list-row-title" id="d-tname">Aguardando técnico</p><p class="list-row-sub">Técnico responsável</p></div>
      <a href="11-chat.html" aria-label="Abrir conversa" style="width:36px;height:36px;border-radius:8px;background:var(--branco);display:flex;align-items:center;justify-content:center;color:inherit;text-decoration:none;"><span class="material-symbols-outlined">chat</span></a>
    </div>

    <div class="detail-box">
      <div class="detail-row"><span class="detail-label">Aparelho</span><span class="detail-value" data-f="Aparelho">—</span></div>
      <div class="detail-row"><span class="detail-label">Tipo de atendimento</span><span class="detail-value" data-f="Tipo de atendimento">—</span></div>
      <div class="detail-row"><span class="detail-label">Prioridade</span><span class="detail-value" data-f="Prioridade">—</span></div>
      <div class="detail-row"><span class="detail-label">Diagnóstico</span><span class="detail-value" data-f="Diagnóstico">—</span></div>
    </div>

    <div id="d-photos" style="margin-bottom:16px;"></div>

    <p class="subtitle" id="d-pay" hidden></p>

    <div class="btn-row">
      <a data-action="cancel" class="btn btn-danger" href="06-minhas-solicitacoes.html">Cancelar</a>
      <a id="d-quote" class="btn" style="background:var(--roxo-vibrante);color:var(--branco);flex:2;" href="08-orcamento.html">Ver orçamento</a>
    </div>
    <a data-action="remove" class="btn btn-outline" style="margin-top:10px;color:var(--vermelho-tx);" href="#"><span class="material-symbols-outlined">delete</span> Excluir solicitação</a>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
