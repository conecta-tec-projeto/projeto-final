<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=JSON.parse(localStorage.getItem("ct_theme"));if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="escuro";document.documentElement.dataset.theme=t||"claro"}catch(e){}</script>
<title>Meu perfil · ConectaTec</title>
<link rel="icon" href="assets/img/icone-escuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="10">
<div class="page">
  <div class="card card-form">
    <div class="back-row"><a class="icon-btn" href="04-dashboard-cliente.html" aria-label="Voltar"><span class="material-symbols-outlined">arrow_back</span></a><h1 class="title-md">Meu perfil</h1></div>

    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:22px;">
      <div style="position:relative;">
        <div class="avatar" style="width:76px;height:76px;font-size:26px;"><span data-initial>?</span></div>
        <div style="position:absolute;bottom:0;right:0;width:24px;height:24px;border-radius:50%;background:var(--roxo-vibrante);border:2px solid var(--branco);display:flex;align-items:center;justify-content:center;color:var(--branco);font-size:12px;"><span class="material-symbols-outlined">photo_camera</span></div>
      </div>
      <p style="font-size:12px;color:var(--roxo-claro-tx);font-weight:500;margin-top:10px;background:var(--roxo-claro-bg);padding:3px 10px;border-radius:20px;">Cliente</p>
    </div>

    <div class="field"><label class="field-label">Nome completo</label><div class="field-input"><span class="field-icon"><span class="material-symbols-outlined">person</span></span><input type="text" id="nome" placeholder="Seu nome"></div></div>
    <div class="field"><label class="field-label">E-mail</label><div class="field-input"><span class="field-icon"><span class="material-symbols-outlined">mail</span></span><input type="text" id="email" placeholder="nome@email.com"></div></div>
    <div class="field"><label class="field-label">Telefone</label><div class="field-input"><span class="field-icon"><span class="material-symbols-outlined">call</span></span><input type="text" id="telefone" placeholder="(00) 00000-0000"></div></div>
    <div class="field"><label class="field-label">Endereço</label><div class="field-input"><span class="field-icon"><span class="material-symbols-outlined">location_on</span></span><input type="text" id="endereco" placeholder="Cidade, Estado"></div></div>

    <p class="field-label">Tema</p>
    <div class="choice-grid" id="theme-grid">
      <div class="choice-card" data-theme="claro"><div><span class="material-symbols-outlined">light_mode</span></div><p class="choice-title">Claro</p></div>
      <div class="choice-card" data-theme="escuro"><div><span class="material-symbols-outlined">dark_mode</span></div><p class="choice-title">Escuro</p></div>
    </div>

    <a data-action="saveprofile" class="btn btn-primary" style="margin-bottom:12px;" href="04-dashboard-cliente.html">Salvar alterações</a>
    <button data-action="logout" class="btn btn-outline" style="color:var(--vermelho-tx);"><span class="material-symbols-outlined">power_settings_new</span> Sair da conta</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
